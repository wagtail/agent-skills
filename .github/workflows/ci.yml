name: Publication checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.19'
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
      - name: Install pinned validation dependencies
        run: uv sync --locked --project tooling
      - name: Validate skills, manifests, catalog, scenarios, and links
        run: uv run --locked --project tooling python scripts/validate.py
      - name: Test packaging and failure cases
        run: uv run --locked --project tooling python -m unittest discover -s tests
      - name: Install pinned Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@$(node -p 'require("./tooling/clients.json")["claude-code"]')"
      - name: Smoke-test both installation routes
        run: uv run --locked --project tooling python scripts/smoke_install.py --claude
      - name: Check release tag matches bundle version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = 'v' + json.loads(Path('plugin.json').read_text())['version']
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must be {expected}')
          PY
      - name: Build release archive and provenance
        run: uv run --locked --project tooling python scripts/build.py
      - name: Require a clean source checkout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path('dist/release.json').read_text())['dirty']:
              raise SystemExit('Checks changed the source checkout; inspect git status')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wagtail-plugin
          path: dist/
          if-no-files-found: error
